# SPDX-License-Identifier: AGPL-3.0-or-later
#
# docs/ROADMAP.md, "Then — packaging". Runs goreleaser on a version tag:
# cross-compiled binaries, checksums, a cosign keyless signature over the
# checksums, and a multi-arch container pushed to GHCR and signed the same
# way. See .goreleaser.yaml and DECISIONS.md D17.
#
# Actions are pinned by commit SHA (version in the trailing comment) rather
# than a floating tag, so a compromised or force-moved tag upstream can't
# silently change what runs in this pipeline.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload its assets
  packages: write # push the container image to GHCR
  id-token: write # cosign keyless signing: the OIDC token IS the key

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog needs the full git history

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
