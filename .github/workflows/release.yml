# SPDX-License-Identifier: AGPL-3.0-or-later
#
# docs/ROADMAP.md, "Then — packaging". Runs goreleaser on a version tag:
# cross-compiled binaries, checksums, a cosign keyless signature over the
# checksums, and a multi-arch container pushed to GHCR and signed the same
# way. See .goreleaser.yaml and DECISIONS.md D17.
#
# Release tags are MAJOR.MINOR.PATCH+BUILD, no "v" prefix (e.g. 1.2.3+4).
# The "+BUILD" form, not a fourth dot, is required: goreleaser hard-fails
# ("invalid semantic version") on a literal 1.2.3.4 tag unless
# --skip=validate is passed, and that flag also disables its dirty-worktree
# check — not something to run permanently in a release pipeline. "+BUILD"
# is valid semver build metadata, confirmed live to parse cleanly with no
# flags needed, and Makefile's VERSION_CSV (the Windows resource's
# FILEVERSION) already expects this exact shape.
#
# This only ever fires for a tag that is actually reachable from master —
# see "Verify tag is on master" below — not merely any v*-shaped tag
# pushed from anywhere, which is what a bare `on.push.tags` filter alone
# would allow.
#
# The job runs inside ghcr.io/epicmorg/debian:trixie-develop (the user's own image)
# rather than bare ubuntu-latest: it already carries the Go version this
# project requires, mingw-w64 (windows/amd64 and windows/386 resource
# icons), and llvm-mingw (windows/arm64's, which Debian's own mingw-w64
# package cannot produce at all — confirmed, it ships no
# aarch64-w64-mingw32-windres). The docker socket is bind-mounted in
# rather than run as docker-in-docker: the job's own container talks to
# the *runner's* daemon as a sibling container, the same way rehlds's own
# Linux build step already does — no nested daemon, no --privileged
# needed for that mount (confirmed live: a plain bind-mount plus running
# as root, which this image already does by default, is sufficient).
#
# Actions are pinned by commit SHA (version in the trailing comment) rather
# than a floating tag, so a compromised or force-moved tag upstream can't
# silently change what runs in this pipeline. ghcr.io/epicmorg/debian:trixie-develop
# below is deliberately the exception: it is the user's own first-party
# build environment, not a third party's, and floating-by-design is the
# actual point of it — this repo picking up a newly added cross-compiler
# there (as just happened with llvm-mingw/arm64) without an edit here is
# the intended relationship, not a supply-chain gap to close.
name: release

on:
  push:
    tags:
      # "+" is a special character in GitHub's own filter-pattern glob
      # syntax (repetition, like extended-glob), not a literal here unless
      # escaped — confirmed via actionlint, which flatly rejects the
      # unescaped form ("*.*.*+*") as an invalid pattern.
      - "*.*.*\\+*"

permissions:
  contents: write # create the GitHub release and upload its assets
  packages: write # push the container image to GHCR
  id-token: write # cosign keyless signing: the OIDC token IS the key

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epicmorg/debian:trixie-develop
      # Sibling-container access to the runner's own daemon (see the file
      # header) — this is what lets docker buildx/push and goreleaser's
      # dockers_v2 pipe work from inside the job's container at all: the
      # image itself ships no docker CLI or daemon.
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog needs the full git history; also what the master-ancestry check below needs

      # Container jobs run as root against a workspace owned by the
      # runner's own user, which git's own safe-directory check refuses to
      # touch by default ("dubious ownership") — confirmed hit locally
      # when testing this same image/mount combination by hand.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # This is the actual "master branch" half of this workflow's release
      # condition — on.push.tags above only constrains the tag's *shape*,
      # not where it was pushed from. A tag created off any other branch
      # must not produce a release.
      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/master — refusing to release a tag pushed from anywhere else."
            exit 1
          fi

      # ghcr.io/epicmorg/debian:trixie-develop has no docker CLI or buildx plugin
      # baked in (confirmed) — only the socket to talk to one. Everything
      # else this job needs (Go, mingw-w64, llvm-mingw) is already there.
      - name: Install docker CLI and buildx plugin
        run: apt-get update -qq && apt-get install -y -qq docker.io docker-buildx

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
