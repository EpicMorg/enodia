#
# Same build as develop.yml (see there for why epicmorg/debian:trixie-
# develop, --snapshot, and what gets skipped), but auto-triggered on every
# pull request instead of run by hand: a PR is an explicit review
# checkpoint, not routine commit-by-commit iteration, so pulling that
# ~5GB image here is an accepted cost — unlike on every push to develop,
# which is exactly what develop.yml exists to avoid.
name: pr build

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: epicmorg/debian:trixie-develop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enodia-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
