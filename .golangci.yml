version: "2"
linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by
  # default in v2 and are not repeated here.
  enable:
    - errorlint    # правильное оборачивание ошибок — критично для типизированных sentinel'ов
    - bodyclose    # утечка HTTP-соединений при 50 параллельных пробах
    - contextcheck # context.Context должен идти насквозь
    - noctx        # запрещает HTTP-запросы без контекста
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G402 # InsecureSkipVerify — намеренная фича, закрыта opt-in флагом
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
